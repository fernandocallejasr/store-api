spring.h2.console.enabled=false

logging.level.io.github.fernandocallejasr.stickerstore=DEBUG

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

management.endpoint.health.access=read_only
management.endpoint.info.access=read_only
management.endpoint.metrics.access=read_only
management.endpoint.prometheus.access=read_only
management.endpoint.health.show-details=always
management.metrics.tags.environment=dev

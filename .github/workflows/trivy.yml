name: trivy

on:
  push:
    branches: [main]
  schedule:
    # Weekly on Monday 06:30 UTC (offset from CodeQL)
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read           # Needed by upload-sarif to fetch workflow run metadata for SARIF fingerprinting

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Trivy filesystem scan (HIGH, CRITICAL)
        # Pinned to commit SHA for supply-chain hardening (third-party action).
        # Dependabot will keep this updated.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

name: trivy

on:
  push:
    branches: [main]
  schedule:
    # Weekly on Monday 06:30 UTC (offset from CodeQL)
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trivy filesystem scan (HIGH, CRITICAL)
        # Pinned to commit SHA for supply-chain hardening (third-party action).
        # Dependabot will keep this updated.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          # SARIF keeps findings out of the public workflow log; they go to the
          # Security tab, which only people with write access can see.
          format: sarif
          output: trivy-results.sarif
          # Without this, SARIF output ignores `severity` and reports (and fails
          # on) every level, LOW included.
          limit-severities-for-sarif: true

      - name: Upload results to the Security tab
        # The scan step fails when it finds something (exit-code 1), which is
        # exactly when the results matter, so upload regardless.
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

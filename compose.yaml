services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stickerstore}
      POSTGRES_USER: ${POSTGRES_USER:-stickerstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stickerstore}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stickerstore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stickerstore} -d ${POSTGRES_DB:-stickerstore}" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  stickerstore_pgdata:

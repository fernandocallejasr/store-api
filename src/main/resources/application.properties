spring.application.name=stickerstore
#debug=true
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
spring.profiles.active=dev
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.access.default=none
management.endpoint.health.access=read_only
management.endpoint.info.access=read_only
management.endpoint.metrics.access=read_only
management.endpoint.prometheus.access=read_only

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-components=when_authorized

management.info.build.enabled=true
management.info.git.enabled=false
management.info.env.enabled=false
management.info.java.enabled=true
management.info.os.enabled=true

management.metrics.tags.application=${spring.application.name}
management.observations.key-values.application=${spring.application.name}

management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s
